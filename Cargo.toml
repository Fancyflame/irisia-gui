[profile.release]
debug = 1

[workspace]
members = [
    "irisia-widgets",
    "irisia",
    "irisia-backend",
    "irisia-macros",
    "irisia-unsafe",
    "examples",
    "tests",
    "irisia-log",
]
resolver = "3"

[workspace.package]
rust-version = "1.86"
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
android_logger = "0.11.0"
anyhow = "1.0"
attr-parser-fn = { git = "https://github.com/Fancyflame/attr-parser-fn.git" }
case = "1.0"
darling = "0.21"
dhat = "0.3"
futures = "0.3"
impl_variadics = "0.1.1"
irisia = { path = "irisia" }
irisia_backend = { path = "irisia-backend" }
irisia_macros = { path = "irisia-macros" }
irisia_unsafe = { path = "irisia-unsafe" }
irisia_widgets = { path = "irisia-widgets" }
lazy_static = "1"
pixels = "0.14"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.8"
skia-safe = "0.80"
smallvec = "1.10"
stack_box = "1"
syn = ">=2.0.38"
take_mut = "0.2"
taffy = { version = "0.8", default-features = false, features = [
    "block_layout",
    "flexbox",
    "grid",
    "content_size",
    "std",
] }
thiserror = "1.0"
tokio = "1.40"
winit = "0.30"
tracing = "0.1"
